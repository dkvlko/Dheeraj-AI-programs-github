<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Keep Alive</title>

<script>
function updateTime() {
    const now = new Date();

    document.getElementById("time").textContent =
        now.toLocaleString();
}

// Update immediately
updateTime();

// Update every second
setInterval(updateTime, 1000);

// Reload every 30 minutes with a unique URL
setTimeout(() => {
    location.href = location.pathname + "?t=" + Date.now();
}, 30 * 60 * 1000);
</script>

</head>

<body>

<h2>Network Keep Alive</h2>

<p>Current Time:</p>
<h3 id="time"></h3>

</body>
</html>
