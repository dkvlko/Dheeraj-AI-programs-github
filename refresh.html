<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Keep Alive</title>

<script>
    setTimeout(() => {
    location.href = location.pathname + "?t=" + Date.now();
}, 1800000);
</script>

</head>

<body>
<h2>Network Keep Alive</h2>

<p>This page refreshes every 30 minutes.</p>

</body>
</html>
