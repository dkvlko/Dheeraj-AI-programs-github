<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Refresh the page every 1800 seconds (30 minutes) -->
  <meta http-equiv="refresh" content="1800">
  <title>Network Keep Alive</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }
  </style>
  <script>
    const TOTAL_SECONDS = 1800; // 30 minutes
    let secondsLeft = TOTAL_SECONDS;

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      // Pads single digits with a leading zero (e.g., 05:09)
      const formattedMins = String(minutes).padStart(2, '0');
      const formattedSecs = String(seconds).padStart(2, '0');
      
      return `${formattedMins}:${formattedSecs}`;
    }

    function updateCountdown() {
      const countdownElement = document.getElementById("countdown");
      
      if (secondsLeft <= 0) {
        countdownElement.textContent = "00:00 - Reloading...";
        return;
      }

      countdownElement.textContent = formatTime(secondsLeft);
      secondsLeft--;
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Display initial time immediately (30:00)
      updateCountdown();
      
      // Tick down every second
      setInterval(updateCountdown, 1000);
    });
  </script>
</head>
<body>
  <h2>Network Keep Alive</h2>
  <p>Next reload in:</p>
  <h3 id="countdown">30:00</h3>
</body>
</html>
