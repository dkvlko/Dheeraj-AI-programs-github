<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Network Keep Alive</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 2rem;
      text-align: center;
    }
  </style>
  <script>
    const DURATION_MS = 10 * 60 * 1000; // 30 minutes in milliseconds
    const targetTime = Date.now() + DURATION_MS;

    function triggerUniqueReload() {
      // Append or replace the unique timestamp query parameter
      const baseUrl = location.origin + location.pathname;
      const uniqueUrl = `${baseUrl}?t=${Date.now()}`;
      location.href = uniqueUrl;
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      
      const formattedMins = String(minutes).padStart(2, '0');
      const formattedSecs = String(seconds).padStart(2, '0');
      
      return `${formattedMins}:${formattedSecs}`;
    }

    function updateTimer() {
      const remainingMs = targetTime - Date.now();
      const secondsLeft = Math.ceil(remainingMs / 1000);

      if (secondsLeft <= 0) {
        document.getElementById("countdown").textContent = "00:00 - Reloading...";
        triggerUniqueReload();
        return;
      }

      document.getElementById("countdown").textContent = formatTime(secondsLeft);
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Initial render
      updateTimer();

      // Tick update every second
      setInterval(updateTimer, 1000);

      // Instantly catch up if the user brings an inactive tab back to focus
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          updateTimer();
        }
      });
    });
  </script>
</head>
<body>
  <h2>Network Keep Alive</h2>
  <p>Next reload in:</p>
  <h3 id="countdown">10:00</h3>
</body>
</html>
