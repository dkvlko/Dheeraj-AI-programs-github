<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flagship Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    padding:16px;
    background:#202124;
    color:white;
    font-family:Arial, sans-serif;
}

.player-container{
    width:min(95vw, 900px);
    margin:20px auto;
}

audio{
    display:block;
    width:100%;
    max-width:100%;
}
</style>


</head>
<body>

<h2>Flagship Player</h2>

<audio id="player" controls autoplay></audio>
<script>

const player = document.getElementById("player");

speechSynthesis.getVoices();

speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
};

async function playCurrent()
{
    // Read metadata from server
    const response = await fetch("/flagship/info");
    const info = await response.json();

    let announcement = "Now playing ";

    if (info.title)
        announcement += info.title;

    if (info.album)
        announcement += ", from the album " + info.album;

    if (info.artist)
        announcement += ", sung by " + info.artist;

    const speech = new SpeechSynthesisUtterance(announcement);

    speech.rate = 1.0;
    speech.pitch = 1.0;
    speech.volume = 1.0;

    speech.onend = () => {

        player.src = "/flagship/current?ts=" + Date.now();
        player.load();

        player.play().catch(()=>{});

    };

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

player.addEventListener("ended", async ()=>{

    await fetch("/flagship/next");

    playCurrent();

});

playCurrent();

</script>

</body>
</html>
