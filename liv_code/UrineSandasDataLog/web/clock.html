<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clock</title>


    <style>

        /*
         * =====================================================
         * GLOBAL
         * =====================================================
         */

        * {
            box-sizing: border-box;
            /*cursor: none !important;*/
        }


        html,
        body {
            /*cursor: none !important;*/

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background-color: #000000 !important;
            color: #ffffff !important;

            overflow: hidden;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }



/*
 * =====================================================
 * FLOATING DETAILS BUTTON
 * =====================================================
 */

        #details-bar {
            /*cursor: pointer !important;*/
            position: fixed;

            right: 2vw;
            bottom: 2vh;

            /*
             * Approximately 3 cm on a normal 1366x768 display.
             *
             * 3cm is approximately 113 CSS pixels at 96 DPI.
             * The clamp makes it responsive on smaller/larger screens.
             */

            width: clamp(70px, 8.25vw, 113px);
            height: clamp(70px, 8.25vw, 113px);

            display: flex;

            justify-content: center;
            align-items: center;

            background-color: #ff8c00;

            color: #000000;

            border: none;

            border-radius: 12px;

            font-size: clamp(13px, 1.2vw, 20px);

            font-weight: 700;

            line-height: 1.1;

            text-align: center;

           /* cursor: none !important;*/

            z-index: 2000;

            user-select: none;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.6);

            transition:
                background-color 0.2s ease,
                transform 0.2s ease;
        }


        /*
         * Slight visual feedback if the pointer/touch
         * is used. Cursor remains hidden.
         */

        #details-bar:active {

            transform: scale(0.94);

            background-color: #ff7600;
        }


        /*
         * =====================================================
         * DETAILS OVERLAY
         * =====================================================
         */

        #details-overlay {

            position: fixed;

            left: 0;
            right: 0;
            top: 0;
            bottom: 0;

            background-color: #000000;

            /*
             * Start completely below the screen.
             */

            transform: translateY(100%);

            /*
             * Smoothly rise from bottom.
             */

            transition:
                transform 0.8s ease-in-out;

            z-index: 1500;

            overflow: hidden;

            /*
             * Hidden overlay must not intercept clicks.
             */

            pointer-events: none;
        }


        /*
         * =====================================================
         * DETAILS OVERLAY OPEN
         * =====================================================
         */

        #details-overlay.details-open {

            transform: translateY(0);

            pointer-events: auto;
        }

        /*
         * =====================================================
         * DETAILS IFRAME
         * =====================================================
         */

        #details-frame {

            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background-color: #000000;
        }
        /*
         * =====================================================
         * MAIN CLOCK PANEL
         * =====================================================
         */

        #clock-panel {

            width: 82vw;
            height: 48vh;

            background-color: #050505 !important;

            color: #ffffff !important;

            border: 2px solid #202020;

            border-radius: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 3vh 4vw;
        }


        /*
         * =====================================================
         * DATE
         * =====================================================
         */

        #date {

            color: #ffffff !important;

            font-size:
                clamp(
                    28px,
                    4vw,
                    70px
                );

            font-weight: 600;

            letter-spacing: 2px;

            margin-bottom: 3vh;

            white-space: nowrap;
        }


        /*
         * =====================================================
         * TIME
         * =====================================================
         */

        #time {

            color: #ffffff !important;

            font-size:
                clamp(
                    70px,
                    11vw,
                    220px
                );

            font-weight: 700;

            letter-spacing: 3px;

            line-height: 1;

            white-space: nowrap;
        }


        /*
         * =====================================================
         * HOLIDAY INFORMATION
         *
         * This is deliberately OUTSIDE the clock panel.
         * It stays at the bottom of the screen.
         * =====================================================
         */

        #holiday {

            position: fixed;

            left: 0;
            right: 0;

            bottom: 5vh;

            color: #ffffff !important;

            background-color: transparent !important;

            font-size:
                clamp(
                    16px,
                    1.8vw,
                    30px
                );

            font-weight: 400;

            line-height: 1.45;

            text-align: center;

            white-space: pre-line;

            padding: 0 5vw;

            z-index: 100;
        }


        /*
         * =====================================================
         * SUBTLE DIVIDER ABOVE HOLIDAY INFORMATION
         * =====================================================
         */

        #holiday::before {

            content: "";

            position: fixed;

            left: 0;
            right: 0;

            bottom: 14vh;

            height: 1px;

            background-color: #202020;
        }


    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CLOCK
         ===================================================== -->

    <div id="clock-panel">

        <div id="date">
            Loading...
        </div>

        <div id="time">
            --:--:-- --
        </div>

    </div>


    <!-- =====================================================
         DAILY HOLIDAY INFORMATION
         ===================================================== -->

    <div id="holiday">
        Checking today's holiday...
    </div>

        <!-- =====================================================
             DATE DETAILS COLLAPSED BAR
             ===================================================== -->

        <div id="details-bar"
             onclick="toggleDateDetails()">

            See<br>Details

        </div>


        <!-- =====================================================
             DATE DETAILS OVERLAY
             ===================================================== -->

        <div id="details-overlay">

            <iframe
                id="details-frame"
                src="/date-details"
                title="Date Details">
            </iframe>

        </div>

    <!-- Local Socket.IO client -->
    <script src="/static/socket.io.min.js"></script>

    <!-- Your local JavaScript -->

    <script src="/static/clock.js"></script>

</body>

</html>
