<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clock</title>


    <style>

        /*
         * =====================================================
         * GLOBAL
         * =====================================================
         */

        * {
            box-sizing: border-box;
            cursor: none !important;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background-color: #000000 !important;
            color: #ffffff !important;

            overflow: hidden;
        }


        body {

            display: flex;

            justify-content: center;
            align-items: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /*
         * =====================================================
         * MAIN CLOCK PANEL
         * =====================================================
         */

        #clock-panel {

            width: 82vw;
            height: 48vh;

            background-color: #050505 !important;

            color: #ffffff !important;

            border: 2px solid #202020;

            border-radius: 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 3vh 4vw;
        }


        /*
         * =====================================================
         * DATE
         * =====================================================
         */

        #date {

            color: #ffffff !important;

            font-size:
                clamp(
                    28px,
                    4vw,
                    70px
                );

            font-weight: 600;

            letter-spacing: 2px;

            margin-bottom: 3vh;

            white-space: nowrap;
        }


        /*
         * =====================================================
         * TIME
         * =====================================================
         */

        #time {

            color: #ffffff !important;

            font-size:
                clamp(
                    70px,
                    11vw,
                    220px
                );

            font-weight: 700;

            letter-spacing: 3px;

            line-height: 1;

            white-space: nowrap;
        }


        /*
         * =====================================================
         * HOLIDAY INFORMATION
         *
         * This is deliberately OUTSIDE the clock panel.
         * It stays at the bottom of the screen.
         * =====================================================
         */

        #holiday {

            position: fixed;

            left: 0;
            right: 0;

            bottom: 5vh;

            color: #ffffff !important;

            background-color: transparent !important;

            font-size:
                clamp(
                    16px,
                    1.8vw,
                    30px
                );

            font-weight: 400;

            line-height: 1.45;

            text-align: center;

            white-space: pre-line;

            padding: 0 5vw;

            z-index: 100;
        }


        /*
         * =====================================================
         * SUBTLE DIVIDER ABOVE HOLIDAY INFORMATION
         * =====================================================
         */

        #holiday::before {

            content: "";

            position: fixed;

            left: 0;
            right: 0;

            bottom: 14vh;

            height: 1px;

            background-color: #202020;
        }


    </style>

</head>


<body>


    <!-- =====================================================
         MAIN CLOCK
         ===================================================== -->

    <div id="clock-panel">

        <div id="date">
            Loading...
        </div>

        <div id="time">
            --:--:-- --
        </div>

    </div>


    <!-- =====================================================
         DAILY HOLIDAY INFORMATION
         ===================================================== -->

    <div id="holiday">
        Checking today's holiday...
    </div>
    <!-- Local Socket.IO client -->

    <script src="/static/socket.io.min.js"></script>

    <!-- Your local JavaScript -->

    <script src="/static/clock.js"></script>

</body>

</html>
