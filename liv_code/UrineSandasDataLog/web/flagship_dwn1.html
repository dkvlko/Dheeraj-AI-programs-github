<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flagship Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    padding:16px;
    background:#202124;
    color:white;
    font-family:Arial, sans-serif;
}

.player-container{
    width:min(95vw, 900px);
    margin:20px auto;
}

audio{
    display:block;
    width:100%;
    max-width:100%;
}
</style>


</head>
<body>

<h2>Flagship Player</h2>

<audio id="player" controls autoplay></audio>
<button id="prev">⏮</button>
<button id="next">⏭</button>
<script>

const player=document.getElementById("player");

function playCurrent()
{
    console.log("Ended:", player.src);
    player.src="/flagship/current?ts="+Date.now();
    player.load();

    player.play().catch(()=>{});
}

document.getElementById("prev").onclick = async () => {
    await fetch("/flagship/previous");
    playCurrent();
};

document.getElementById("next").onclick = async () => {
    await fetch("/flagship/next");
    playCurrent();
};

player.addEventListener("ended",async ()=>{

    await fetch("/flagship/next");

    playCurrent();

});

player.addEventListener("error", () => {
    console.log("Audio error:", player.error);
});

player.addEventListener("stalled", () => {
    console.log("Playback stalled");
});

player.addEventListener("waiting", () => {
    console.log("Waiting for data");
});

player.addEventListener("pause", () => {
    console.log("Paused");
});

player.addEventListener("abort", () => {
    console.log("Aborted");
});

player.addEventListener("suspend", () => {
    console.log("Suspended");
});

playCurrent();

</script>

</body>
</html>
