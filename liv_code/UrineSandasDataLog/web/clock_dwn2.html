<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clock</title>

<style>
    * {
        box-sizing: border-box;
        cursor: none !important;
    }

    html,
    body {
        cursor: none;        
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;

        background-color: #000000 !important;
        color: #ffffff !important;

        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;
    }

    #holiday {
        color: #ffffff !important;

        font-size: clamp(
            16px,
            1.8vw,
            30px
        );

        font-weight: 400;

        line-height: 1.35;

        margin-top: 3vh;

        max-width: 90%;

        text-align: center;

        white-space: pre-line;
    }


     /*
         * =====================================================
         * SUBTLE DIVIDER ABOVE HOLIDAY INFORMATION
         * =====================================================
         */

        #holiday::before {

            content: "";

            position: fixed;

            left: 0;
            right: 0;

            bottom: 14vh;

            height: 1px;

            background-color: #202020;
        }
    #clock-panel {

        width: 82vw;
        height: 42vh;

        background-color: #050505 !important;

        color: #ffffff !important;

        border: 2px solid #202020;
        border-radius: 20px;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        text-align: center;

        padding: 3vh 4vw;
    }

    #date {
        color: #ffffff !important;

        font-size: clamp(28px, 4vw, 70px);

        font-weight: 600;

        letter-spacing: 2px;

        margin-bottom: 3vh;

        white-space: nowrap;
    }

    #time {
        color: #ffffff !important;

        font-size: clamp(70px, 11vw, 220px);

        font-weight: 700;

        letter-spacing: 3px;

        line-height: 1;

        white-space: nowrap;
    }

</style>
</head>


<body>

    <div id="clock-panel">

        <div id="date">
            Loading...
        </div>

        <div id="time">
            --:--:-- --
        </div>

    </div>

        <div id="holiday">
            Checking today's holiday...
        </div>

    <!-- Local Socket.IO client -->

    <script src="/static/socket.io.min.js"></script>

    <!-- Your local JavaScript -->

    <script src="/static/clock.js"></script>

</body>

</html>
