<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Remote</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;

            font-family: Arial, sans-serif;

            background: #181818;
        }


        /* ----------------------------------------------------
           Landing page
           ---------------------------------------------------- */

        #remoteMenu {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }


        .menuButton {

            width: min(80vw, 360px);
            height: 90px;

            border: none;
            border-radius: 18px;

            background: #333;
            color: white;

            font-size: 28px;
            font-weight: bold;
        }


        .menuButton:active {

            transform: scale(0.97);

            background: #555;
        }


        /* ----------------------------------------------------
           Mousepad
           ---------------------------------------------------- */

        #mousePad {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #202020;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        /* ----------------------------------------------------
           Top buttons
           ---------------------------------------------------- */

        .topButton {

            position: fixed;

            z-index: 100;

            top: max(
                12px,
                env(safe-area-inset-top)
            );

            height: 48px;

            padding: 0 18px;

            border: none;
            border-radius: 12px;

            background: rgba(60, 60, 60, 0.90);

            color: white;

            font-size: 17px;
            font-weight: bold;

            touch-action: manipulation;
        }


        #backButton {

            left: max(
                12px,
                env(safe-area-inset-left)
            );
        }


        #fullscreenButton {

            right: max(
                12px,
                env(safe-area-inset-right)
            );
        }

    </style>

</head>


<body>

{% if page == "remote" %}

    <!-- ================================================
         LANDING PAGE
         ================================================ -->

    <div id="remoteMenu">

        <button
            id="keyboardButton"
            class="menuButton"
            type="button"
        >
            keyboard
        </button>


        <button
            id="mouseButton"
            class="menuButton"
            type="button"
        >
            mousepad
        </button>

    </div>


{% else %}

    <!-- ================================================
         MOUSEPAD
         ================================================ -->

    <div id="mousePad"></div>


    <button
        id="backButton"
        class="topButton"
        type="button"
    >
        ← Back
    </button>


    <button
        id="fullscreenButton"
        class="topButton"
        type="button"
    >
        ⛶ Fullscreen
    </button>

{% endif %}


<script src="{{ url_for(
    'static',
    filename='socket.io.min.js'
) }}"></script>


<script>
    window.REMOTE_PAGE = "{{ page }}";
</script>


<script src="{{ url_for(
    'remote_lap.static',
    filename='lapremote.js'
) }}"></script>


</body>

</html>
