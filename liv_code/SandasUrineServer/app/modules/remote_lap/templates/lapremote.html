<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Remote</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;

            font-family: Arial, sans-serif;

            background: #181818;
        }


        /* =========================================================
           LANDING PAGE
           ========================================================= */

        /* ============================================================
   KEYBOARD SCREEN
   ============================================================ */

#keyboardScreen {
    display: none;

    width: 100%;
    min-height: 100vh;

    box-sizing: border-box;

    padding: 8px;

    background: #111;

    user-select: none;
    -webkit-user-select: none;
}


/* Back button */

.keyboardTopButton {
    position: absolute;

    top: 8px;
    left: 8px;

    z-index: 20;

    padding: 8px 14px;

    border: 0;
    border-radius: 8px;

    background: #333;
    color: white;

    font-size: 12px !important;
}

/* ============================================================
   KEYBOARD SCREEN
   ============================================================ */

#keyboardScreen {
    display: none;

    position: relative;

    width: 100%;
    height: 100dvh;

    box-sizing: border-box;

    /*
       39px at the top for the Back button.
       3px at the bottom as requested.
    */
    padding: 39px 3px 3px 3px;

    background: #111;

    overflow: hidden;

    user-select: none;
    -webkit-user-select: none;
}


/* ============================================================
   BACK BUTTON
   ============================================================ */

.keyboardBackButton {
    position: absolute;

    top: 4px;
    left: 5px;

    height: 30px;

    padding: 0 12px;

    box-sizing: border-box;

    border: 2px solid #555;
    border-radius: 6px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;

    font-size: 11px;
    font-weight: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 100;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* ============================================================
   KEYBOARD
   ============================================================ */

#keyboard {
    width: 100%;
    height: 100%;

    box-sizing: border-box;

    display: flex;
    flex-direction: column;

    gap: 2px;
}


/* ============================================================
   ROW
   ============================================================ */

.keyboardRow {
    width: 100%;

    flex: 1 1 0;

    min-height: 0;

    display: grid;

    /*
       16 equal columns.
       Almost every key occupies exactly one column.
    */
    grid-template-columns:
        repeat(16, minmax(0, 1fr));

    gap: 2px;
}


/* ============================================================
   NORMAL KEY
   ============================================================ */

.key {
    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    box-sizing: border-box;

    padding: 0;

    border: 2px solid #555;
    border-radius: 5px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;

    font-size: 11px !important;
    font-weight: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

.key:active {
    background: #555;
}


/* ============================================================
   WIDE KEYS
   ============================================================ */

.wideKey {
    grid-column: span 2;
}


.extraWideKey {
    grid-column: span 2;
}


.spaceKey {
    grid-column: span 4;
}


/* ============================================================
   ZO
   ============================================================ */

#zoomKey {
    font-weight: bold;

    background: #393939;

    border-color: #777;
}


/* ============================================================
   LANDSCAPE REQUEST
   ============================================================ */

@media (orientation: portrait) {

    #keyboardScreen::before {
        content: "Please rotate your iPhone to landscape mode.";

        position: absolute;

        top: 50%;
        left: 50%;

        transform: translate(-50%, -50%);

        width: 90%;

        text-align: center;

        color: white;

        font-family: Arial, sans-serif;

        font-size: 16px;

        z-index: 200;
    }

    #keyboard {
        visibility: hidden;
    }
}


/* ============================================================
   LANDSCAPE
   ============================================================ */

@media (orientation: landscape) {

    #keyboardScreen {
        height: 100dvh;
    }
}
/*keyboard CSS ends*/

        #remoteMenu {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }


        .menuButton {

            width: min(80vw, 360px);
            height: 90px;

            border: none;
            border-radius: 18px;

            background: #333;
            color: white;

            font-size: 28px;
            font-weight: bold;

            touch-action: manipulation;
        }


        .menuButton:active {

            transform: scale(0.97);

            background: #555;
        }


        /* =========================================================
           MOUSEPAD
           ========================================================= */

        #mousePad {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #202020;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =========================================================
           COMMON TOP BUTTON
           ========================================================= */

        .topButton {

            position: fixed;

            z-index: 100;

            top: max(
                12px,
                env(safe-area-inset-top)
            );

            height: 48px;

            padding: 0 18px;

            border: none;
            border-radius: 12px;

            background: rgba(60, 60, 60, 0.90);

            color: white;

            font-size: 17px;
            font-weight: bold;

            touch-action: manipulation;
        }


        #backButton {

            left: max(
                12px,
                env(safe-area-inset-left)
            );
        }


        #fullscreenButton {

            right: max(
                12px,
                env(safe-area-inset-right)
            );
        }


        /* =========================================================
           KEYBOARD
           ========================================================= */

        #keyboardScreen {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            padding-top: max(
                70px,
                calc(env(safe-area-inset-top) + 58px)
            );

            padding-left: max(
                6px,
                env(safe-area-inset-left)
            );

            padding-right: max(
                6px,
                env(safe-area-inset-right)
            );

            padding-bottom: max(
                8px,
                env(safe-area-inset-bottom)
            );

            background: #181818;

            display: flex;
            flex-direction: column;

            justify-content: flex-start;

            gap: 7px;

            touch-action: manipulation;
        }


        .keyboardRow {

            width: 100%;

            display: flex;

            justify-content: center;

            gap: 5px;

            flex: 1;
        }


        .key {

            flex: 1;

            min-width: 0;

            border: none;
            border-radius: 8px;

            background: #3a3a3a;

            color: white;

            font-size: clamp(
                17px,
                5vw,
                28px
            );

            font-weight: 500;

            padding: 0;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }


        .key:active {

            background: #666;

            transform: scale(0.96);
        }


        .keyWide {

            flex: 1.8;
        }


        .keyExtraWide {

            flex: 3;
        }


        .specialKey {

            background: #505050;

            font-size: clamp(
                14px,
                4vw,
                21px
            );
        }


        /* =========================================================
           ZOOM BUTTON
           ========================================================= */

        #zoomKey {

            position: absolute;

            right: 10px;
            bottom: max(
                10px,
                env(safe-area-inset-bottom)
            );

            width: 82px;
            height: 48px;

            border: none;
            border-radius: 12px;

            background: #505050;

            color: white;

            font-size: 17px;
            font-weight: bold;

            touch-action: manipulation;
        }


        #zoomKey:active {

            background: #707070;

            transform: scale(0.96);
        }


    </style>

</head>


<body>


{% if page == "remote" %}

    <!-- =========================================================
         REMOTE CONTROL LANDING PAGE
         ========================================================= -->

    <div id="remoteMenu">

        <button
            id="keyboardButton"
            class="menuButton"
            type="button"
        >
            keyboard
        </button>

        <button
            id="mouseButton"
            class="menuButton"
            type="button"
        >
            mousepad
        </button>

    </div>


    <!-- =========================================================
     KEYBOARD REMOTE
     ========================================================= -->

<div id="keyboardScreen">

    <!-- Back to remote menu -->
    <button
        id="keyboardBackButton"
        class="keyboardBackButton"
        type="button"
    >
        ← Back
    </button>


    <div id="keyboard">

        <!-- FUNCTION ROW -->
        <div class="keyboardRow">

            <button class="key">Esc</button>
            <button class="key">F1</button>
            <button class="key">F2</button>
            <button class="key">F3</button>
            <button class="key">F4</button>
            <button class="key">F5</button>
            <button class="key">F6</button>
            <button class="key">F7</button>
            <button class="key">F8</button>
            <button class="key">F9</button>
            <button class="key">F10</button>
            <button class="key">F11</button>
            <button class="key">F12</button>
            <button class="key">Prt</button>
            <button class="key">Del</button>

            <button
                id="zoomKey"
                class="key"
                type="button"
            >
                ZO
            </button>

        </div>


        <!-- NUMBER ROW -->
        <div class="keyboardRow">

            <button class="key">`</button>
            <button class="key">1</button>
            <button class="key">2</button>
            <button class="key">3</button>
            <button class="key">4</button>
            <button class="key">5</button>
            <button class="key">6</button>
            <button class="key">7</button>
            <button class="key">8</button>
            <button class="key">9</button>
            <button class="key">0</button>
            <button class="key">-</button>
            <button class="key">=</button>

            <button class="key wideKey">
                Back
            </button>

        </div>


        <!-- QWERTY ROW -->
        <div class="keyboardRow">

            <button class="key wideKey">Tab</button>

            <button
                class="key functionalKey"
                data-key="q"
            >
                Q
            </button>

            <button
                class="key functionalKey"
                data-key="w"
            >
                W
            </button>

            <button class="key">E</button>
            <button class="key">R</button>
            <button class="key">T</button>
            <button class="key">Y</button>
            <button class="key">U</button>
            <button class="key">I</button>
            <button class="key">O</button>
            <button class="key">P</button>
            <button class="key">[</button>
            <button class="key">]</button>
            <button class="key">\</button>

        </div>


        <!-- HOME ROW -->
        <div class="keyboardRow">

            <button class="key wideKey">
                Caps
            </button>

            <button class="key">A</button>
            <button class="key">S</button>
            <button class="key">D</button>
            <button class="key">F</button>
            <button class="key">G</button>
            <button class="key">H</button>
            <button class="key">J</button>
            <button class="key">K</button>
            <button class="key">L</button>
            <button class="key">;</button>
            <button class="key">'</button>

            <button
                id="enterKey"
                class="key wideKey functionalKey"
                data-key="Enter"
            >
                Enter
            </button>

        </div>


        <!-- SHIFT ROW -->
        <div class="keyboardRow">

            <button class="key extraWideKey">
                Shift
            </button>

            <button class="key">Z</button>
            <button class="key">X</button>
            <button class="key">C</button>
            <button class="key">V</button>
            <button class="key">B</button>
            <button class="key">N</button>
            <button class="key">M</button>
            <button class="key">,</button>
            <button class="key">.</button>
            <button class="key">/</button>

            <button class="key extraWideKey">
                Shift
            </button>

        </div>


        <!-- BOTTOM ROW -->
        <div class="keyboardRow">

            <button class="key wideKey">
                Ctrl
            </button>

            <button class="key wideKey">
                Alt
            </button>

            <button class="key wideKey">
                Super
            </button>

            <button class="key">←</button>
            <button class="key">↑</button>
            <button class="key">↓</button>
            <button class="key">→</button>

            <button class="key spaceKey">
                Space
            </button>

            <button class="key wideKey">
                Alt
            </button>

            <button class="key wideKey">
                Ctrl
            </button>

        </div>

    </div>

</div>
    <!-- END keyboardScreen -->


{% else %}

    <!-- =========================================================
         MOUSEPAD
         ========================================================= -->

    <div id="mousePad"></div>


    <button
        id="backButton"
        class="topButton"
        type="button"
    >
        ← Back
    </button>


    <button
        id="fullscreenButton"
        class="topButton"
        type="button"
    >
        ⛶ Fullscreen
    </button>


{% endif %}

<script src="{{ url_for(
    'static',
    filename='socket.io.min.js'
) }}"></script>


<script>

    window.REMOTE_PAGE = "{{ page }}";

</script>


<script src="{{ url_for(
    'remote_lap.static',
    filename='lapremote.js'
) }}"></script>


</body>

</html>
