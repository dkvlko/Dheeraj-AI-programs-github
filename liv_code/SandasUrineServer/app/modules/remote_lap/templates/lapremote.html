<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Remote</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;

            font-family: Arial, sans-serif;

            background: #181818;
        }


        /* =========================================================
           LANDING PAGE
           ========================================================= */

        #remoteMenu {

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            gap: 25px;
        }


        .menuButton {

            width: min(80vw, 360px);
            height: 90px;

            border: none;
            border-radius: 18px;

            background: #333;
            color: white;

            font-size: 28px;
            font-weight: bold;

            touch-action: manipulation;
        }


        .menuButton:active {

            transform: scale(0.97);

            background: #555;
        }


        /* =========================================================
           MOUSEPAD
           ========================================================= */

        #mousePad {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            background: #202020;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =========================================================
           COMMON TOP BUTTON
           ========================================================= */

        .topButton {

            position: fixed;

            z-index: 100;

            top: max(
                12px,
                env(safe-area-inset-top)
            );

            height: 48px;

            padding: 0 18px;

            border: none;
            border-radius: 12px;

            background: rgba(60, 60, 60, 0.90);

            color: white;

            font-size: 17px;
            font-weight: bold;

            touch-action: manipulation;
        }


        #backButton {

            left: max(
                12px,
                env(safe-area-inset-left)
            );
        }


        #fullscreenButton {

            right: max(
                12px,
                env(safe-area-inset-right)
            );
        }


        /* =========================================================
           KEYBOARD
           ========================================================= */

        #keyboardScreen {

            position: fixed;

            left: 0;
            top: 0;

            width: 100vw;
            height: 100vh;

            padding-top: max(
                70px,
                calc(env(safe-area-inset-top) + 58px)
            );

            padding-left: max(
                6px,
                env(safe-area-inset-left)
            );

            padding-right: max(
                6px,
                env(safe-area-inset-right)
            );

            padding-bottom: max(
                8px,
                env(safe-area-inset-bottom)
            );

            background: #181818;

            display: flex;
            flex-direction: column;

            justify-content: flex-start;

            gap: 7px;

            touch-action: manipulation;
        }


        .keyboardRow {

            width: 100%;

            display: flex;

            justify-content: center;

            gap: 5px;

            flex: 1;
        }


        .key {

            flex: 1;

            min-width: 0;

            border: none;
            border-radius: 8px;

            background: #3a3a3a;

            color: white;

            font-size: clamp(
                17px,
                5vw,
                28px
            );

            font-weight: 500;

            padding: 0;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }


        .key:active {

            background: #666;

            transform: scale(0.96);
        }


        .keyWide {

            flex: 1.8;
        }


        .keyExtraWide {

            flex: 3;
        }


        .specialKey {

            background: #505050;

            font-size: clamp(
                14px,
                4vw,
                21px
            );
        }


        /* =========================================================
           ZOOM BUTTON
           ========================================================= */

        #zoomKey {

            position: absolute;

            right: 10px;
            bottom: max(
                10px,
                env(safe-area-inset-bottom)
            );

            width: 82px;
            height: 48px;

            border: none;
            border-radius: 12px;

            background: #505050;

            color: white;

            font-size: 17px;
            font-weight: bold;

            touch-action: manipulation;
        }


        #zoomKey:active {

            background: #707070;

            transform: scale(0.96);
        }


    </style>

</head>


<body>


{% if page == "remote" %}

    <!-- =========================================================
         LANDING PAGE
         ========================================================= -->

    <div id="remoteMenu">

        <button
            id="keyboardButton"
            class="menuButton"
            type="button"
        >
            keyboard
        </button>


        <button
            id="mouseButton"
            class="menuButton"
            type="button"
        >
            mousepad
        </button>

    </div>


    <!-- =========================================================
         KEYBOARD
         ========================================================= -->

    <div
        id="keyboardScreen"
        style="display: none;"
    >

        <button
            id="keyboardBackButton"
            class="topButton"
            type="button"
        >
            ← Back
        </button>


        <!-- QWERTY -->

        <div class="keyboardRow">

            <button class="key" data-key="q">Q</button>
            <button class="key" data-key="w">W</button>
            <button class="key" data-key="e">E</button>
            <button class="key" data-key="r">R</button>
            <button class="key" data-key="t">T</button>
            <button class="key" data-key="y">Y</button>
            <button class="key" data-key="u">U</button>
            <button class="key" data-key="i">I</button>
            <button class="key" data-key="o">O</button>
            <button class="key" data-key="p">P</button>

        </div>


        <div class="keyboardRow">

            <button class="key" data-key="a">A</button>
            <button class="key" data-key="s">S</button>
            <button class="key" data-key="d">D</button>
            <button class="key" data-key="f">F</button>
            <button class="key" data-key="g">G</button>
            <button class="key" data-key="h">H</button>
            <button class="key" data-key="j">J</button>
            <button class="key" data-key="k">K</button>
            <button class="key" data-key="l">L</button>

        </div>


        <div class="keyboardRow">

            <button class="key" data-key="z">Z</button>
            <button class="key" data-key="x">X</button>
            <button class="key" data-key="c">C</button>
            <button class="key" data-key="v">V</button>
            <button class="key" data-key="b">B</button>
            <button class="key" data-key="n">N</button>
            <button class="key" data-key="m">M</button>

        </div>


        <!-- NUMBERS -->

        <div class="keyboardRow">

            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>

        </div>


        <!-- SPECIAL CHARACTERS -->

        <div class="keyboardRow">

            <button class="key" data-key="-">-</button>
            <button class="key" data-key="_">_</button>
            <button class="key" data-key=".">.</button>
            <button class="key" data-key=",">,</button>
            <button class="key" data-key="/">/</button>
            <button class="key" data-key="?">?</button>
            <button class="key" data-key=":">:</button>
            <button class="key" data-key=";">;</button>

        </div>


        <!-- CONTROL KEYS -->

        <div class="keyboardRow">

            <button
                class="key specialKey keyWide"
                data-key="Backspace"
            >
                ⌫
            </button>


            <button
                class="key specialKey keyWide"
                data-key="Enter"
            >
                Enter
            </button>


            <button
                class="key specialKey keyExtraWide"
                data-key=" "
            >
                Space
            </button>

        </div>


        <!-- ZOOM -->

        <button
            id="zoomKey"
            type="button"
        >
            Zoom
        </button>

    </div>


{% else %}

    <!-- =========================================================
         MOUSEPAD
         ========================================================= -->

    <div id="mousePad"></div>


    <button
        id="backButton"
        class="topButton"
        type="button"
    >
        ← Back
    </button>


    <button
        id="fullscreenButton"
        class="topButton"
        type="button"
    >
        ⛶ Fullscreen
    </button>


{% endif %}


<script src="{{ url_for(
    'static',
    filename='socket.io.min.js'
) }}"></script>


<script>

    window.REMOTE_PAGE = "{{ page }}";

</script>


<script src="{{ url_for(
    'remote_lap.static',
    filename='lapremote.js'
) }}"></script>


</body>

</html>
