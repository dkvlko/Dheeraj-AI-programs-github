<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Remote</title><style>
*{box-sizing:border-box}
html,body{
    width:100%;height:100%;margin:0;overflow:hidden;
    font-family:Arial,sans-serif;background:#181818;user-select:none;
    -webkit-user-select:none
}
#remoteMenu
    {width:100vw;height:100vh;display:flex;flex-direction:column;
justify-content:center;align-items:center;gap:25px;background:#181818
}
.menuButton
    {width:min(80vw,360px);height:90px;border:2px solid #555;border-radius:18px;
background:#333;color:#fff;font:bold 28px Arial,sans-serif;touch-action:manipulation;
-webkit-tap-highlight-color:transparent
}
.menuButton:active{
    background:#555;transform:scale(.97)}

</style></head>
<body>
<div id="remoteMenu"><button class="menuButton" id="keyboardButton">Keyboard</button>
<button class="menuButton" id="mouseButton">Mousepad</button></div>
<script>
keyboardButton.onclick=()=>location.href="/remote_lap/keyboard";
mouseButton.onclick=()=>location.href="/remote_lap/mousepad";
</script>'
</body>
</html>
