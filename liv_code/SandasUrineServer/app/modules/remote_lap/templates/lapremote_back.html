<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1,
            maximum-scale=1,
            user-scalable=no,
            viewport-fit=cover
        "
    >

    <title>Remote</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            overflow: hidden;

            user-select: none;
            -webkit-user-select: none;

            font-family: Arial, sans-serif;

            background: #181818;
        }


/* =========================================================
   LANDING PAGE
   ========================================================= */

#remoteMenu {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 25px;

    background: #181818;
}

.menuButton {
    width: min(80vw, 360px);
    height: 90px;

    border: 2px solid #555;
    border-radius: 18px;

    background: #333;
    color: white;

    font-family: Arial, sans-serif;
    font-size: 28px;
    font-weight: bold;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.menuButton:active {
    background: #555;
    transform: scale(0.97);
}


/* =========================================================
   KEYBOARD SCREEN
   ========================================================= */

#keyboardScreen {
    display: none;

    position: fixed;

    left: 0;
    top: 0;

    width: 100vw;
    height: 100dvh;

    box-sizing: border-box;

    padding-top: max(
        70px,
        calc(env(safe-area-inset-top) + 58px)
    );

    padding-left: max(
        11px,
        env(safe-area-inset-left)
    );

    padding-right: max(
        6px,
        env(safe-area-inset-right)
    );

    padding-bottom: max(
        8px,
        env(safe-area-inset-bottom)
    );

    background: #181818;

    flex-direction: column;

    justify-content: flex-start;

    gap: 7px;

    touch-action: manipulation;

    user-select: none;
    -webkit-user-select: none;
}


/* =========================================================
   KEYBOARD BACK BUTTON
   ========================================================= */

.keyboardBackButton {
    position: absolute;

    top: 4px;
    left: 5px;

    height: 30px;

    padding: 0 12px;

    box-sizing: border-box;

    border: 2px solid #555;
    border-radius: 6px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 500;

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 100;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}


/* =========================================================
   KEYBOARD
   ========================================================= */

#keyboard {
    width: 100%;
    height: 100%;

    box-sizing: border-box;

    display: flex;
    flex-direction: column;

    gap: 2px;
}


/* =========================================================
   KEYBOARD ROW
   ========================================================= */

.keyboardRow {
    width: 100%;

    flex: 1 1 0;

    min-height: 0;

    display: grid;

    grid-template-columns:
        repeat(16, minmax(0, 1fr));

    gap: 2px;
}


/* =========================================================
   NORMAL KEY
   ========================================================= */

.key {
    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 0;

    box-sizing: border-box;

    padding: 0;

    border: 2px solid #555;
    border-radius: 5px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;

    font-size: 11px !important;
    font-weight: 500;

    display: flex;

    align-items: center;
    justify-content: center;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;
}

.key:active {
    background: #555;
}


/* =========================================================
   WIDE KEYS
   ========================================================= */

.wideKey {
    grid-column: span 2;
}

.extraWideKey {
    grid-column: span 2;
}

.spaceKey {
    grid-column: span 4;
}


/* =========================================================
   LANDSCAPE
   ========================================================= */

@media (orientation: landscape) {

    #keyboardScreen {
        height: 100dvh;
    }
}

    </style>

</head>


<body>


{% if page == "remote" %}

    <!-- =========================================================
         REMOTE CONTROL LANDING PAGE
         ========================================================= -->

    <div id="remoteMenu">

        <button
            id="keyboardButton"
            class="menuButton"
            type="button"
        >
            keyboard
        </button>

        <button
            id="mouseButton"
            class="menuButton"
            type="button"
        >
            mousepad
        </button>

    </div>


    <!-- =========================================================
     KEYBOARD REMOTE
     ========================================================= -->

<!-- KEYBOARD -->
<div id="keyboardScreen">

    <button
        id="keyboardBackButton"
        class="keyboardBackButton"
        type="button"
    >
        ← Back
    </button>

<div id="keyboard">

    <!-- FUNCTION ROW -->
    <div class="keyboardRow">

        <button class="key" data-key="Esc">Esc</button>
        <button class="key" data-key="F1">F1</button>
        <button class="key" data-key="F2">F2</button>
        <button class="key" data-key="F3">F3</button>
        <button class="key" data-key="F4">F4</button>
        <button class="key" data-key="F5">F5</button>
        <button class="key" data-key="F6">F6</button>
        <button class="key" data-key="F7">F7</button>
        <button class="key" data-key="F8">F8</button>
        <button class="key" data-key="F9">F9</button>
        <button class="key" data-key="F10">F10</button>
        <button class="key" data-key="F11">F11</button>
        <button class="key" data-key="F12">F12</button>
        <button class="key" data-key="PrintScreen">Prt</button>
        <button class="key" data-key="Delete">Del</button>

    </div>


    <!-- NUMBER ROW -->
    <div class="keyboardRow">

        <button class="key" data-key="grave">`</button>
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="0">0</button>
        <button class="key" data-key="minus">-</button>
        <button class="key" data-key="equal">=</button>

        <button
            class="key wideKey"
            data-key="Backspace"
        >
            Back
        </button>

    </div>


    <!-- QWERTY ROW -->
    <div class="keyboardRow">

        <button
            class="key wideKey"
            data-key="Tab"
        >
            Tab
        </button>

        <button
            class="key"
            data-key="q"
        >
            Q
        </button>

        <button
            class="key"
            data-key="w"
        >
            W
        </button>

        <button class="key" data-key="e">E</button>
        <button class="key" data-key="r">R</button>
        <button class="key" data-key="t">T</button>
        <button class="key" data-key="y">Y</button>
        <button class="key" data-key="u">U</button>
        <button class="key" data-key="i">I</button>
        <button class="key" data-key="o">O</button>
        <button class="key" data-key="p">P</button>
        <button class="key" data-key="leftBracket">[</button>
        <button class="key" data-key="rightBracket">]</button>
        <button class="key" data-key="backslash">\</button>

    </div>


    <!-- HOME ROW -->
    <div class="keyboardRow">

        <button
            class="key wideKey"
            data-key="CapsLock"
        >
            Caps
        </button>

        <button class="key" data-key="a">A</button>
        <button class="key" data-key="s">S</button>
        <button class="key" data-key="d">D</button>
        <button class="key" data-key="f">F</button>
        <button class="key" data-key="g">G</button>
        <button class="key" data-key="h">H</button>
        <button class="key" data-key="j">J</button>
        <button class="key" data-key="k">K</button>
        <button class="key" data-key="l">L</button>
        <button class="key" data-key="semicolon">;</button>
        <button class="key" data-key="apostrophe">'</button>

        <button
            id="enterKey"
            class="key wideKey"
            data-key="Enter"
        >
            Enter
        </button>

    </div>


    <!-- SHIFT ROW -->
    <div class="keyboardRow">

        <button
            class="key extraWideKey"
            data-key="ShiftLeft"
        >
            Shift
        </button>

        <button class="key" data-key="z">Z</button>
        <button class="key" data-key="x">X</button>
        <button class="key" data-key="c">C</button>
        <button class="key" data-key="v">V</button>
        <button class="key" data-key="b">B</button>
        <button class="key" data-key="n">N</button>
        <button class="key" data-key="m">M</button>
        <button class="key" data-key="comma">,</button>
        <button class="key" data-key="period">.</button>
        <button class="key" data-key="slash">/</button>

        <button
            class="key extraWideKey"
            data-key="ShiftRight"
        >
            Shift
        </button>

    </div>


    <!-- BOTTOM ROW -->
    <div class="keyboardRow">

        <button
            class="key wideKey"
            data-key="ControlLeft"
        >
            Ctrl
        </button>

        <button
            class="key wideKey"
            data-key="AltLeft"
        >
            Alt
        </button>

        <button
            class="key wideKey"
            data-key="SuperLeft"
        >
            Super
        </button>

        <button class="key" data-key="ArrowLeft">←</button>
        <button class="key" data-key="ArrowUp">↑</button>
        <button class="key" data-key="ArrowDown">↓</button>
        <button class="key" data-key="ArrowRight">→</button>

        <button
            class="key spaceKey"
            data-key="Space"
        >
            Space
        </button>

        <button
            class="key wideKey"
            data-key="AltRight"
        >
            Alt
        </button>

        <button
            class="key wideKey"
            data-key="ControlRight"
        >
            Ctrl
        </button>

    </div>

</div>
</div>
    <!-- END keyboardScreen -->


{% else %}

    <!-- =========================================================
         MOUSEPAD
         ========================================================= -->

    <div id="mousePad"></div>


    <button
        id="backButton"
        class="topButton"
        type="button"
    >
        ← Back
    </button>


    <button
        id="fullscreenButton"
        class="topButton"
        type="button"
    >
        ⛶ Fullscreen
    </button>


{% endif %}

<script src="{{ url_for(
    'static',
    filename='socket.io.min.js'
) }}"></script>


<script>

    window.REMOTE_PAGE = "{{ page }}";

</script>


<script src="{{ url_for(
    'remote_lap.static',
    filename='lapremote.js'
) }}"></script>


</body>

</html>
