<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Remote — Keyboard</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    font-family: Arial, sans-serif;
    background: #181818;
}

body {
    touch-action: manipulation;
}

/* =========================================================
   KEYBOARD SCREEN
   Landscape only
   ========================================================= */

#keyboardScreen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100dvh;

    padding-top: max(38px, env(safe-area-inset-top));
    padding-right: max(8px, env(safe-area-inset-right));
    padding-bottom: max(8px, env(safe-area-inset-bottom));
    padding-left: max(8px, env(safe-area-inset-left));

    background: #181818;

    display: flex;
    flex-direction: column;

    /* Deliberately keep a small, fixed gap between rows. */
    gap: 3px;

    touch-action: manipulation;
}

/* Back button */
.keyboardBackButton {
    position: absolute;

    top: max(4px, env(safe-area-inset-top));
    left: max(5px, env(safe-area-inset-left));

    height: 27px;
    padding: 0 11px;

    border: 2px solid #555;
    border-radius: 6px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;
    font-size: 11px;
    font-weight: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 100;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

/* =========================================================
   KEYBOARD

   IMPORTANT:
   Every row uses exactly 15 logical columns.

   This removes the variable/overflowing grid geometry from
   the previous version.
   ========================================================= */

#keyboard {
    width: 100%;
    height: 100%;
    min-height: 0;

    display: flex;
    flex-direction: column;

    gap: 3px;
}

/*
 * Six rows.
 * On iPhone 8 / iPhone 13 the available height is limited,
 * so all rows share the available height equally.
 */
.keyboardRow {
    width: 100%;
    min-width: 0;
    min-height: 0;

    flex: 1 1 0;

    display: grid;
    grid-template-columns: repeat(15, minmax(0, 1fr));
    gap: 3px;
}

/* =========================================================
   KEYS

   Each button is its own complete hit rectangle.
   No pseudo-elements or absolute-positioned overlays.
   ========================================================= */

.key {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;

    padding: 0;

    border: 1px solid #555;
    border-radius: 5px;

    background: #292929;
    color: #f5f5f5;

    font-family: Arial, sans-serif;
    font-size: clamp(10px, 2.7vw, 16px);
    font-weight: 500;

    display: flex;
    align-items: center;
    justify-content: center;

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;

    /*
     * Prevent browser default button appearance from creating
     * unexpected internal dimensions.
     */
    appearance: none;
    -webkit-appearance: none;

    position: relative;
    z-index: 1;
}

.key:active,
.key.pressed {
    background: #555;
    transform: translateY(1px);
}

/* Keys spanning logical columns */
.span2 {
    grid-column: span 2;
}

.span3 {
    grid-column: span 3;
}

.span4 {
    grid-column: span 4;
}

/* Invisible alignment cells */
.spacer {
    visibility: hidden;
    pointer-events: none;
}

/* =========================================================
   LANDSCAPE DEVICE TUNING
   ========================================================= */

/*
 * iPhone 8 landscape: 667 x 375 points.
 * Apple documents its UIKit size as 375 x 667 points.
 */
@media (orientation: landscape) and (max-width: 700px) {
    #keyboardScreen {
        padding-top: max(36px, env(safe-area-inset-top));
        padding-bottom: max(6px, env(safe-area-inset-bottom));
        gap: 2px;
    }

    #keyboard {
        gap: 2px;
    }

    .keyboardRow {
        gap: 2px;
    }

    .key {
        font-size: clamp(9px, 2.6vw, 13px);
        border-radius: 4px;
    }
}

/*
 * iPhone 13 landscape: 844 x 390 points.
 */
@media (orientation: landscape) and (min-width: 701px) and (max-width: 900px) {
    #keyboardScreen {
        padding-top: max(38px, env(safe-area-inset-top));
        padding-bottom: max(7px, env(safe-area-inset-bottom));
    }

    .key {
        font-size: clamp(10px, 2.0vw, 15px);
    }
}

/*
 * iPad mini 2 landscape: 1024 x 768 points.
 * Keep the keyboard from becoming unnecessarily huge vertically.
 */
@media (orientation: landscape) and (min-width: 901px) {
    #keyboardScreen {
        padding-top: max(42px, env(safe-area-inset-top));
        padding-left: max(10px, env(safe-area-inset-left));
        padding-right: max(10px, env(safe-area-inset-right));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
    }

    #keyboard {
        /*
         * Leave a little unused space below rather than making
         * the keys excessively tall on the iPad.
         */
        height: min(100%, 430px);
    }

    .key {
        font-size: clamp(12px, 1.35vw, 17px);
    }
}

/* Portrait is deliberately not supported. */
@media (orientation: portrait) {
    #keyboardScreen {
        display: none;
    }

    body::before {
        content: "Please rotate the device to landscape";
        position: fixed;
        inset: 0;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 20px;

        color: #f5f5f5;
        background: #181818;

        font-size: 20px;
        text-align: center;
    }
}
</style>
</head>

<body>

<div id="keyboardScreen">

    <button
        id="keyboardBackButton"
        class="keyboardBackButton"
        type="button"
    >
        ← Back
    </button>

    <div id="keyboard">

        <!-- =================================================
             FUNCTION ROW
             15 columns:
             Esc + F1..F12 + Prt + Del
             ================================================= -->
        <div class="keyboardRow">

            <button class="key" data-key="Esc">Esc</button>
            <button class="key" data-key="F1">F1</button>
            <button class="key" data-key="F2">F2</button>
            <button class="key" data-key="F3">F3</button>
            <button class="key" data-key="F4">F4</button>
            <button class="key" data-key="F5">F5</button>
            <button class="key" data-key="F6">F6</button>
            <button class="key" data-key="F7">F7</button>
            <button class="key" data-key="F8">F8</button>
            <button class="key" data-key="F9">F9</button>
            <button class="key" data-key="F10">F10</button>
            <button class="key" data-key="F11">F11</button>
            <button class="key" data-key="F12">F12</button>
            <button class="key" data-key="PrintScreen">Prt</button>
            <button class="key" data-key="Delete">Del</button>

        </div>

        <!-- =================================================
             NUMBER ROW
             13 normal columns + Backspace spanning 2
             ================================================= -->
        <div class="keyboardRow">

            <button class="key" data-key="grave">`</button>
            <button class="key" data-key="1">1</button>
            <button class="key" data-key="2">2</button>
            <button class="key" data-key="3">3</button>
            <button class="key" data-key="4">4</button>
            <button class="key" data-key="5">5</button>
            <button class="key" data-key="6">6</button>
            <button class="key" data-key="7">7</button>
            <button class="key" data-key="8">8</button>
            <button class="key" data-key="9">9</button>
            <button class="key" data-key="0">0</button>
            <button class="key" data-key="minus">-</button>
            <button class="key" data-key="equal">=</button>

            <button class="key span2" data-key="Backspace">Back</button>

        </div>

        <!-- =================================================
             QWERTY ROW
             Tab spans 2 + 13 normal keys = 15
             ================================================= -->
        <div class="keyboardRow">

            <button class="key span2" data-key="Tab">Tab</button>

            <button class="key" data-key="q">Q</button>
            <button class="key" data-key="w">W</button>
            <button class="key" data-key="e">E</button>
            <button class="key" data-key="r">R</button>
            <button class="key" data-key="t">T</button>
            <button class="key" data-key="y">Y</button>
            <button class="key" data-key="u">U</button>
            <button class="key" data-key="i">I</button>
            <button class="key" data-key="o">O</button>
            <button class="key" data-key="p">P</button>
            <button class="key" data-key="leftBracket">[</button>
            <button class="key" data-key="rightBracket">]</button>
            <button class="key" data-key="backslash">\</button>

        </div>

        <!-- =================================================
             HOME ROW
             Caps 2 + 9 letters + ; + ' + Enter 2 = 15
             ================================================= -->
        <div class="keyboardRow">

            <button class="key span2" data-key="CapsLock">Caps</button>

            <button class="key" data-key="a">A</button>
            <button class="key" data-key="s">S</button>
            <button class="key" data-key="d">D</button>
            <button class="key" data-key="f">F</button>
            <button class="key" data-key="g">G</button>
            <button class="key" data-key="h">H</button>
            <button class="key" data-key="j">J</button>
            <button class="key" data-key="k">K</button>
            <button class="key" data-key="l">L</button>
            <button class="key" data-key="semicolon">;</button>
            <button class="key" data-key="apostrophe">'</button>

            <button id="enterKey" class="key span2" data-key="Enter">
                Enter
            </button>

        </div>

        <!-- =================================================
             SHIFT ROW
             2 + 7 letters + 3 punctuation + 2 = 14
             Add one alignment spacer at the end.
             ================================================= -->
        <div class="keyboardRow">

            <button class="key span2" data-key="ShiftLeft">Shift</button>

            <button class="key" data-key="z">Z</button>
            <button class="key" data-key="x">X</button>
            <button class="key" data-key="c">C</button>
            <button class="key" data-key="v">V</button>
            <button class="key" data-key="b">B</button>
            <button class="key" data-key="n">N</button>
            <button class="key" data-key="m">M</button>
            <button class="key" data-key="comma">,</button>
            <button class="key" data-key="period">.</button>
            <button class="key" data-key="slash">/</button>

            <button class="key span2" data-key="ShiftRight">Shift</button>

            <span class="spacer"></span>

        </div>

        <!-- =================================================
             BOTTOM ROW
             15 columns exactly.
             ================================================= -->
        <div class="keyboardRow">

            <button class="key" data-key="ControlLeft">Ctrl</button>
            <button class="key" data-key="AltLeft">Alt</button>
            <button class="key" data-key="SuperLeft">Super</button>

            <button class="key" data-key="ArrowLeft">←</button>
            <button class="key" data-key="ArrowUp">↑</button>
            <button class="key" data-key="ArrowDown">↓</button>
            <button class="key" data-key="ArrowRight">→</button>

            <button class="key span4" data-key="Space">Space</button>

            <button class="key" data-key="AltRight">Alt</button>
            <button class="key" data-key="ControlRight">Ctrl</button>

            <span class="spacer"></span>
            <span class="spacer"></span>

        </div>

    </div>
</div>

<script src="{{ url_for(
    'static',
    filename='socket.io.min.js'
) }}"></script>

<script src="{{ url_for(
    'remote_lap.static',
    filename='keyboard.js'
) }}"></script>

</body>
</html>
