<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Mouse Test</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #202020;
            color: white;
            font-family: sans-serif;
        }

        #mousePad {
            width: 100%;
            height: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        #backButton {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;

            padding: 10px 16px;
            border: none;
            border-radius: 8px;

            background: #444;
            color: white;

            font-size: 16px;
        }
    </style>
</head>

<body>
<button id="backButton">← Back</button>

<div id="mousePad">
    Touch and move here
</div>


<!-- Application-wide Socket.IO -->
<script src="{{ url_for('static',
                        filename='socket.io.min.js') }}"></script>

<script>
"use strict";
// Touch input cycle:
// 2 seconds ENABLED
// 1 second DISABLED
// repeat forever

let touchInputEnabled = true;

function startTouchInputCycle() {
    setInterval(() => {
        // Disable touch input after 2 seconds
        touchInputEnabled = false;
        console.log("TOUCH INPUT: DISABLED");

        setTimeout(() => {
            // Enable touch input after 1 second
            touchInputEnabled = true;
            console.log("TOUCH INPUT: ENABLED");
        }, 1000);

    }, 3000);
}

startTouchInputCycle();

const socket = io();

const pad = document.getElementById("mousePad");
const backButton = document.getElementById("backButton");


/* ------------------------------------------------------------
   Connection
   ------------------------------------------------------------ */

socket.on("connect", () => {
    console.log("CONNECTED:", socket.id);
});

socket.on("disconnect", () => {
    console.log("DISCONNECTED");
});


/* ------------------------------------------------------------
   Back
   ------------------------------------------------------------ */

backButton.addEventListener("click", () => {
    window.history.back();
});


/* ------------------------------------------------------------
   Touch state
   ------------------------------------------------------------ */

let fingers = new Map();

let startTime = 0;

let lastTapTime = 0;


/* ------------------------------------------------------------
   TOUCH START
   ------------------------------------------------------------ */

pad.addEventListener(
    "touchstart",
    event => {

        if (!touchInputEnabled) {
            return;
        }
        event.preventDefault();

        const now = performance.now();

        if (fingers.size === 0) {
            startTime = now;
        }

        for (const touch of event.changedTouches) {

            fingers.set(touch.identifier, {
                x: touch.clientX,
                y: touch.clientY,

                lastX: touch.clientX,
                lastY: touch.clientY,

                startX: touch.clientX,
                startY: touch.clientY
            });
        }

    },
    { passive: false }
);


/* ------------------------------------------------------------
   TOUCH MOVE
   ------------------------------------------------------------ */

pad.addEventListener(
    "touchmove",
    event => {

        if (!touchInputEnabled) {
            return;
        }
        event.preventDefault();

        for (const touch of event.changedTouches) {

            const finger =
                fingers.get(touch.identifier);

            if (!finger) {
                continue;
            }

            const dx =
                touch.clientX - finger.lastX;

            const dy =
                touch.clientY - finger.lastY;

            /*if (dx !== 0 || dy !== 0) {*/

                socket.emit(
                    "mouse_test_move",
                    {
                        dx: dx,
                        dy: dy
                    }
                );
            /*}*/


            finger.x = touch.clientX;
            finger.y = touch.clientY;

            finger.lastX = touch.clientX;
            finger.lastY = touch.clientY;
        }

    },
    { passive: false }
);


/* ------------------------------------------------------------
   TOUCH END
   ------------------------------------------------------------ */

pad.addEventListener(
    "touchend",
    event => {

        if (!touchInputEnabled) {
            return;
        }
        event.preventDefault();

        const now = performance.now();

        const fingerCount = fingers.size;

        let moved = false;


        /*
         * Determine whether the finger moved significantly.
         */

        for (const touch of event.changedTouches) {

            const finger =
                fingers.get(touch.identifier);

            if (!finger) {
                continue;
            }

            const dx =
                touch.clientX - finger.startX;

            const dy =
                touch.clientY - finger.startY;


            if (
                Math.abs(dx) > 10 ||
                Math.abs(dy) > 10
            ) {
                moved = true;
            }
        }


        /*
         * Remove the fingers.
         */

        for (const touch of event.changedTouches) {
            fingers.delete(touch.identifier);
        }


        /*
         * One-finger tap.
         */

        if (
            fingerCount === 1 &&
            !moved &&
            now - startTime < 400
        ) {

            /*
             * Double click.
             */

            if (
                now - lastTapTime < 400
            ) {

                socket.emit(
                    "mouse_test_double_click"
                );

                console.log("DOUBLE TAP");

                lastTapTime = 0;

            }

            /*
             * Single click.
             */

            else {

                socket.emit(
                    "mouse_test_click",
                    {
                        button: "left"
                    }
                );

                console.log("SINGLE TAP");

                lastTapTime = now;
            }
        }


        /*
         * Two-finger tap = right click.
         */

        else if (
            fingerCount === 2 &&
            !moved
        ) {

            socket.emit(
                "mouse_test_click",
                {
                    button: "right"
                }
            );

            console.log("TWO-FINGER TAP");
        }
    },
    { passive: false }
);


/* ------------------------------------------------------------
   Two-finger scrolling
   ------------------------------------------------------------ */

pad.addEventListener(
    "touchmove",
    event => {

        if (!touchInputEnabled) {
            return;
        }
        if (fingers.size !== 2) {
            return;
        }

        event.preventDefault();

        const points = [...fingers.values()];

        if (points.length !== 2) {
            return;
        }

        const currentY =
            (points[0].y + points[1].y) / 2;

        const previousY =
            (points[0].lastY + points[1].lastY) / 2;

        const dy =
            currentY - previousY;


        if (Math.abs(dy) > 1) {

            socket.emit(
                "mouse_test_scroll",
                {
                    amount: -dy
                }
            );
        }

    },
    { passive: false }
);


/* ------------------------------------------------------------
   Prevent browser gestures
   ------------------------------------------------------------ */

document.addEventListener(
    "gesturestart",
    event => event.preventDefault(),
    { passive: false }
);

document.addEventListener(
    "gesturechange",
    event => event.preventDefault(),
    { passive: false }
);

document.addEventListener(
    "gestureend",
    event => event.preventDefault(),
    { passive: false }
);

</script>

</body>
</html>
