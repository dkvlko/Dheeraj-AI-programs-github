<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clock</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
    }

    body {
        font-family: Calibri, Carlito, Arial, sans-serif;
    }

    .page {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
        gap: 8px;
    }

    /* The bottom frame is exactly 1/15 of the available page height. */
    .clock-frame {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        border: 5px solid #ffffff;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2vh 2vw;
        color: #ffffff
    }

    .day {
        font-size: clamp(42px, 8vw, 110px);
        font-weight: 700;
        line-height: 1.0;
        margin-bottom: 2vh;
    }

    .date {
        font-size: clamp(38px, 7vw, 96px);
        font-weight: 700;
        line-height: 1.0;
        margin-bottom: 3vh;
    }

    .time {
        font-size: clamp(62px, 11vw, 155px);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: 0.02em;
        white-space: nowrap;
    }

    .bottom-frame {
        position: relative;
        flex: 0 0 calc((100% - 8px) / 5);
        min-height: 0;
        border: 3px solid #ffffff;
        border-radius: 8px;
    }

    .details-button {
        position: absolute;
        right: 8px;
        bottom: 8px;
        width: 192px;
        height: 192px;
        max-width: calc(100% - 16px);
        max-height: calc(100% - 16px);
        border: 3px solid #a84f00;
        border-radius: 12px;
        background: #f28c18;
        color: #111;
        font: 700 28px Calibri, Carlito, Arial, sans-serif;
        cursor: pointer;
        box-shadow: 0 3px 8px rgba(0,0,0,.22);
    }

    .events {
        position: absolute;
        left: 10px;
        top: 8px;
        right: 220px;
        bottom: 8px;
        overflow: hidden;
        color: #ffffff;
        font-size: 20px;
        line-height: 1.35;
        font-weight: 400;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .event-row {
        margin: 0 0 2px 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .event-date {
        font-weight: 700;
        margin-right: 8px;
    }

    .event-name {
        font-weight: 400;
    }

    .event-effect {
        font-style: italic;
        margin-left: 8px;
    }

    .details-button:hover { background: #ff9d2e; }
    .details-button:active { transform: translateY(1px); }
    .details-button:focus-visible {
        outline: 4px solid #222;
        outline-offset: 3px;
    }

    @media (max-width: 700px) {
        .page { padding: 6px; gap: 5px; }
        .clock-frame { border-width: 3px; border-radius: 8px; }
        .bottom-frame { border-width: 2px; }
        .events {
            left: 6px;
            right: 108px;
            top: 5px;
            bottom: 5px;
            font-size: 20px;
        }

        .details-button {
            width: 96px;
            height: 96px;
            font-size: 18px;
        }
    }
</style>
</head>
<body>
<main class="page">
    <section class="clock-frame" aria-label="Current date and time">
        <div id="day" class="day"></div>
        <div id="date" class="date"></div>
        <div id="time" class="time" aria-live="polite"></div>
    </section>

    <section class="bottom-frame" aria-label="Today's and upcoming events">
        <div id="events" class="events" aria-live="polite"></div>
        <button class="details-button" type="button" id="detailsButton">
            Details
        </button>
    </section>
</main>

<script>

function getDayName(dateText) {
    const d = new Date(dateText + "T00:00:00");

    return new Intl.DateTimeFormat("en-US", {
        weekday: "long"
    }).format(d);
}

(function () {
    const dayEl = document.getElementById("day");
    const dateEl = document.getElementById("date");
    const timeEl = document.getElementById("time");
    const detailsButton = document.getElementById("detailsButton");
    const eventsEl = document.getElementById("events");

    const EVENTS_JSON_URL =
        "/clock_lap/static/sortedeventstoday.json";

    function formatDisplayDate(dateText) {
        const d = new Date(dateText + "T00:00:00");

        return new Intl.DateTimeFormat("en-US", {
            weekday: "long",
            month: "short",
            day: "numeric"
        }).format(d);
    }

    function getEffectText(events) {
        const effects = [];

        events.forEach(function (event) {
            if (!Array.isArray(event.effects)) {
                return;
            }

            event.effects.forEach(function (effect) {
                if (!effect || typeof effect !== "object") {
                    return;
                }

                const value =
                    effect.effect ??
                    effect.description ??
                    effect.Effect ??
                    effect.Description;

                if (value && !effects.includes(String(value))) {
                    effects.push(String(value));
                }
            });
        });

        return effects.join(", ");
    }

    function renderEvents(documentData) {
        const days = Array.isArray(documentData.days)
            ? documentData.days
            : [];

        if (!days.length) {
            eventsEl.textContent = "No Events Today";
            return;
        }

        /*
         * Always display today's date first.
         * Then display the next two dates which contain events.
         *
         * This means the bottom frame contains at most three
         * date/event rows, while today's "No Events Today"
         * message is still preserved.
         */
        const selectedDays = [days[0]];

        for (let i = 1; i < days.length; i++) {
            const day = days[i];

            if (
                Array.isArray(day.events) &&
                day.events.length > 0
            ) {
                selectedDays.push(day);
            }

            if (selectedDays.length === 3) {
                break;
            }
        }

        eventsEl.replaceChildren();

        selectedDays.forEach(function (day) {
            const row = document.createElement("div");
            row.className = "event-row";

            const dateSpan = document.createElement("span");
            dateSpan.className = "event-date";
            dateSpan.textContent =
                formatDisplayDate(day.date) + ":";

            const nameSpan = document.createElement("span");
            nameSpan.className = "event-name";

            const events = Array.isArray(day.events)
                ? day.events
                : [];

            const eventNames = events
                .map(function (event) {
                    return event.event_name;
                })
                .filter(function (name) {
                    return name;
                });

            nameSpan.textContent =
                eventNames.length
                    ? eventNames.join(", ")
                    : "No Events";

            row.appendChild(dateSpan);
            row.appendChild(nameSpan);

            const effectText = getEffectText(events);

            if (effectText) {
                const effectSpan =
                    document.createElement("span");

                effectSpan.className = "event-effect";
                effectSpan.textContent =
                    "(" + effectText + ")";

                row.appendChild(effectSpan);
            }

            eventsEl.appendChild(row);
        });
    }

    async function loadEvents() {
        try {
            const response = await fetch(
                EVENTS_JSON_URL + "?t=" + Date.now(),
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            const documentData = await response.json();

            renderEvents(documentData);

        } catch (error) {
            console.error(
                "Unable to load events JSON:",
                error
            );

            eventsEl.textContent =
                "Unable to load events";
        }
    }

    function updateClock() {
        const now = new Date();

        const day = new Intl.DateTimeFormat("en-US", {
            weekday: "long"
        }).format(now);

        const date = new Intl.DateTimeFormat("en-US", {
            month: "long",
            day: "numeric",
            year: "numeric"
        }).format(now);

        const time = new Intl.DateTimeFormat("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        }).format(now);

        dayEl.textContent = day;
        dateEl.textContent = date;
        timeEl.textContent = time;
    }

    detailsButton.addEventListener("click", function () {
        window.location.href = "/clock_lap/details_date.html";
    });

    updateClock();
    setInterval(updateClock, 1000);

    loadEvents();

    // Refresh the event data every 5 minutes.
    setInterval(loadEvents, 30 * 60 * 1000);
})();
</script>
</body>
</html>
