<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flagship Music</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin-top: 20px;
}

.icon-btn {
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
}
.icon-btn img {
    width: clamp(48px, 10vw, 72px);
    height: clamp(48px, 10vw, 72px);
    display: block;
}

.icon-btn:active {
    transform: scale(0.95);
}
#playlistStatus {

    margin-top:20px;

    width:95%;
    max-width:900px;

    margin-left:auto;
    margin-right:auto;

    text-align:left;

    font-family:Arial;
    font-size:16px;

    word-break:break-word;
}

#playlistStatus div{
    margin:8px 0;
}

body{
    margin:0;
    padding:16px;
    background:#202124;
    color:white;
    font-family:Arial, sans-serif;
}

.player-container{
    width:min(95vw, 900px);
    margin:20px auto;
}

audio{
    display:block;
    width:100%;
    max-width:100%;
}
</style>


</head>
<body>

<h2>Flagship Player</h2>
<audio id="player" controls autoplay></audio>

<div class="controls">
    <button id="prev" class="icon-btn">
        <img src="/flagship/static/icons/rewind-button.png" alt="Previous">
    </button>

    <button id="next" class="icon-btn">
        <img src="/flagship/static/icons/forward.png" alt="Next">
    </button>
</div>

<div id="playlistStatus">

    <div>
        <b>Previous:</b>
        <span id="previousSong"></span>
    </div>

    <div>
        <b>Current:</b>
        <span id="currentSong"></span>
    </div>

    <div>
        <b>Next:</b>
        <span id="nextSong"></span>
    </div>

</div>


<script>
document.addEventListener('DOMContentLoaded', function(){

var player=document.getElementById("player");
async function updateStatus()
{
    var r = await fetch("/flagship/status");

    var s = await r.json();

    previousSong.textContent = s.previous || "";
    currentSong.textContent  = s.current  || "";
    nextSong.textContent     = s.next     || "";
}

function playCurrent()
{
    console.log("Ended:", player.src);
    player.src="/flagship/current?ts="+Date.now();
    player.load();

    updateStatus();
    player.play().catch(function () {});
}

document.getElementById("prev").onclick = function () {
    fetch("/flagship/previous").then(function(){
        playCurrent();
    });
};

document.getElementById("next").onclick = function () {
    fetch("/flagship/next").then(function(){
        playCurrent();
    });
};

player.addEventListener("ended",async function () {

    await fetch("/flagship/advance");

    playCurrent();

});

player.addEventListener("error", function () {
    console.log("Audio error:", player.error);
});

player.addEventListener("stalled", function () {
    console.log("Playback stalled");
});

player.addEventListener("waiting", function () {
    console.log("Waiting for data");
});

player.addEventListener("pause", function () {
    console.log("Paused");
});

player.addEventListener("abort", function () {
    console.log("Aborted");
});

player.addEventListener("suspend", function () {
    console.log("Suspended");
});

playCurrent();


});
</script>

</body>
</html>
