<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>Android TV Remote</title>

    <link
        rel="stylesheet"
        href="{{ url_for('tvremote.static', filename='tvremote/tvremote.css') }}"
    >
</head>

<body>

<div id="tvRemoteScreen">

    <header class="topbar">
        <button
            type="button"
            id="backToRemoteButton"
            class="topbarButton"
        >←</button>

        <div class="topbarTitle">Android TV</div>

        <div
            id="connectionStatus"
            class="connectionStatus"
        >
            Connecting...
        </div>
    </header>

    <main class="remote">

        <div
            id="gridOverlay"
            class="gridOverlay showGrid"
            aria-hidden="true"
        >
            <div class="gridCenterMarker"></div>
        </div>

        <div class="gridControls">
            <label>
                <input
                    type="checkbox"
                    id="showGrid"
                    checked
                >
                Show 8 × 8 Grid
            </label>
        </div>

        <div id="remoteGrid" class="remoteGrid">

            <!-- ROW 1 -->

            <button
                type="button"
                class="remoteButton powerButton"
                style="grid-column: 7 / 9; grid-row: 1;"
                data-command="power"
                aria-label="Power"
            >
                ⏻
            </button>


            <!-- ROW 2 -->

            <button
                type="button"
                class="remoteButton dpadButton dpadUp"
                style="grid-column: 4 / 6; grid-row: 2;"
                data-command="up"
                aria-label="Up"
            >
                ▲
            </button>


            <!-- ROW 3 -->

            <button
                type="button"
                class="remoteButton dpadButton dpadLeft"
                style="grid-column: 1 / 4; grid-row: 3;"
                data-command="left"
                aria-label="Left"
            >
                ◀
            </button>

            <button
                type="button"
                class="remoteButton dpadButton dpadSelect"
                style="grid-column: 4 / 6; grid-row: 3;"
                data-command="select"
                aria-label="OK"
            >
                OK
            </button>

            <button
                type="button"
                class="remoteButton dpadButton dpadRight"
                style="grid-column: 6 / 9; grid-row: 3;"
                data-command="right"
                aria-label="Right"
            >
                ▶
            </button>


            <!-- ROW 4 -->

            <button
                type="button"
                class="remoteButton dpadButton dpadDown"
                style="grid-column: 4 / 6; grid-row: 4;"
                data-command="down"
                aria-label="Down"
            >
                ▼
            </button>


            <!-- ROW 5 -->

            <button
                type="button"
                class="remoteButton navigationButton backButton"
                style="grid-column: 1 / 4; grid-row: 5;"
                data-command="back"
                aria-label="Back"
            >
                <span class="largeIcon">↩</span>
                <span>BACK</span>
            </button>

            <button
                type="button"
                class="remoteButton navigationButton homeButton"
                style="grid-column: 4 / 6; grid-row: 5;"
                data-command="home"
                aria-label="Home"
            >
                <span class="largeIcon">⌂</span>
                <span>HOME</span>
            </button>

            <button
                type="button"
                class="remoteButton navigationButton muteButton"
                style="grid-column: 6 / 9; grid-row: 5;"
                data-command="mute"
                aria-label="Mute"
            >
                <span class="largeIcon">🔇</span>
                <span>MUTE</span>
            </button>


            <!-- ROW 6 -->

            <button
                type="button"
                class="remoteButton appButton netflixButton"
                style="grid-column: 1 / 4; grid-row: 6;"
                data-command="netflix"
                aria-label="Netflix"
            >
                Netflix
            </button>

            <button
                type="button"
                class="remoteButton appButton youtubeButton"
                style="grid-column: 4 / 6; grid-row: 6;"
                data-command="youtube"
                aria-label="YouTube"
            >
                YouTube
            </button>

            <button
                type="button"
                class="remoteButton appButton primeVideoButton"
                style="grid-column: 6 / 9; grid-row: 6;"
                data-package="com.amazon.amazonvideo.livingroom"
                aria-label="Prime Video"
            >
                Prime Video
            </button>


            <!-- ROW 7 -->

            <section
                class="volumeControl"
                style="grid-column: 1 / 9; grid-row: 7;"
            >
                <button
                    type="button"
                    class="remoteButton volumeButton"
                    data-command="vol_down"
                    aria-label="Volume down"
                >
                    −
                </button>

                <div class="volumeLabel">
                    VOLUME
                </div>

                <button
                    type="button"
                    class="remoteButton volumeButton"
                    data-command="vol_up"
                    aria-label="Volume up"
                >
                    +
                </button>
            </section>


            <!-- ROW 8 -->

            <section
                class="textEntry"
                style="grid-column: 1 / 9; grid-row: 8;"
            >
                <textarea
                    id="tvTextInput"
                    rows="3"
                    wrap="soft"
                    placeholder="Type text on TV"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="sentences"
                    spellcheck="false"
                ></textarea>

                <button
                    type="button"
                    id="sendTextButton"
                    class="remoteButton sendTextButton"
                >
                    SEND
                </button>
            </section>

        </div>

    </main>

</div>

<script src="{{ url_for('static', filename='socket.io.min.js') }}"></script>

<script src="{{ url_for('tvremote.static', filename='tvremote/tvremote.js') }}"></script>

<script>
(function () {

    const checkbox = document.getElementById("showGrid");
    const overlay = document.getElementById("gridOverlay");

    if (!checkbox || !overlay) {
        return;
    }

    function updateGridVisibility() {
        overlay.classList.toggle(
            "showGrid",
            checkbox.checked
        );
    }

    checkbox.addEventListener(
        "change",
        updateGridVisibility
    );

    updateGridVisibility();

})();
</script>

</body>
</html>
