<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Movies</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 260px;
        }

        .movie-button {
            display: flex;
            justify-content: center;
            align-items: center;

            height: 60px;

            background: #222;
            color: white;

            text-decoration: none;
            font-size: 20px;

            border: 1px solid #555;
            border-radius: 10px;

            cursor: pointer;
        }

        .movie-button:hover {
            background: #333;
        }

        .movie-button:active {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="buttons">

        <a class="movie-button"
           href="{{ url_for('.show_movie') }}">
            In Browser
        </a>

        <a class="movie-button"
           href="{{ url_for('.show_movie_tv') }}">
            On TV
        </a>

    </div>

</body>
</html>
