<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ movie }}</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: black;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
        }
    </style>
</head>

<body>

    <video
        id="moviePlayer"
        controls
        autoplay
        playsinline
        preload="auto"
    >
        <source
            src="{{ movie_url }}"
            type="video/mp4"
        >

        Your browser does not support HTML5 video.
    </video>

    <script>
        const player = document.getElementById("moviePlayer");

        player.addEventListener("error", function () {
            console.error(
                "Movie playback error:",
                player.error
            );
        });

        player.addEventListener("loadedmetadata", function () {
            console.log(
                "Movie loaded:",
                "{{ movie }}"
            );
        });
    </script>

</body>
</html>
