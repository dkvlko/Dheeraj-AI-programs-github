plugins {
    id 'com.android.application'
}

android {
    namespace 'com.noclasslessons.screensaver'
    compileSdk 36

    defaultConfig {
        applicationId 'com.noclasslessons.screensaver'
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
